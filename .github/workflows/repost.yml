name: Yella Repost Bot

on:
  schedule:
    - cron: '10 * * * *'   # каждый час в :10 (не пересекается с promo)
  workflow_dispatch:

jobs:
  repost:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Restore state
        uses: actions/cache@v4
        with:
          path: state.json
          key: repost-state-${{ github.run_id }}
          restore-keys: |
            repost-state-

      - name: Run repost script
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python repost.py

      - name: Save state
        uses: actions/cache/save@v4
        if: always()
        with:
          path: state.json
          key: repost-state-${{ github.run_id }}
