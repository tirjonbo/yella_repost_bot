name: Yella Promo Bot

on:
  schedule:
    - cron: '0 5,13 * * *'    # 10:00 и 18:00 по Ташкенту (UTC+5)
  workflow_dispatch:

jobs:
  promo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests Pillow

      - name: Restore state
        uses: actions/cache@v4
        with:
          path: promo_state.json
          key: promo-state-${{ github.run_id }}
          restore-keys: |
            promo-state-

      - name: Run promo bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          YELLA_API_SECRET: ${{ secrets.YELLA_API_SECRET }}
        run: python promo_bot.py

      - name: Save state
        uses: actions/cache/save@v4
        if: always()
        with:
          path: promo_state.json
          key: promo-state-${{ github.run_id }}
